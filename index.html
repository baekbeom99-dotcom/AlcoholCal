<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffb5a7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="알콜달력">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>알콜달력</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="nav" id="prev" aria-label="이전 달">‹</button>
    <button class="title" id="title" title="오늘로 이동"></button>
    <button class="nav" id="next" aria-label="다음 달">›</button>
  </header>

  <main>
    <div class="weekdays">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div class="grid" id="grid"></div>

    <section class="card summary" id="summary"></section>

    <section class="card tools">
      <button class="ghost" id="exportBtn">백업 저장</button>
      <label class="ghost">백업 불러오기<input type="file" id="importInput" accept="application/json" hidden></label>
    </section>
  </main>

  <!-- 날짜 기록 시트 -->
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="close" id="closeSheet" aria-label="닫기">✕</button>
    </div>
    <p class="cheer" id="cheer"></p>

    <ul class="entries" id="entries"></ul>
    <input class="memo" id="memo" maxlength="40" placeholder="이 날 메모 · 예: 동기 모임 🍗">
  </section>

  <!-- 빠른 기록: 술병을 한 번 누르면 선택한 날에 한 병 -->
  <section class="quick" id="quick">
    <div class="quick-head">
      <span class="quick-date" id="quickDate"></span>
      <div class="people">
        <button id="pMinus" aria-label="인원 줄이기">−</button>
        <span id="peopleLbl">혼자</span>
        <button id="pPlus" aria-label="인원 늘리기">+</button>
      </div>
    </div>
    <div class="quick-types" id="quickTypes"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
